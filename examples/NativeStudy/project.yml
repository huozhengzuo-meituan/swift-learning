name: NativeStudy
options:
  bundleIdPrefix: learning.swift
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NativeStudy-macOS:
    type: application
    platform: macOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_MODULE_NAME: NativeStudy
        PRODUCT_BUNDLE_IDENTIFIER: learning.swift.NativeStudy.mac
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        ENABLE_HARDENED_RUNTIME: YES
  NativeStudy-iOS:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      base:
        PRODUCT_MODULE_NAME: NativeStudy
        PRODUCT_BUNDLE_IDENTIFIER: learning.swift.NativeStudy.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  NativeStudyTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: NativeStudy-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: learning.swift.NativeStudy.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NativeStudy-macOS.app/Contents/MacOS/NativeStudy-macOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  NativeStudy-macOS:
    build:
      targets:
        NativeStudy-macOS: all
        NativeStudyTests: [test]
    test:
      targets: [NativeStudyTests]
  NativeStudy-iOS:
    build:
      targets:
        NativeStudy-iOS: all
